<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guniyo</title>
<style>html,body{margin:0;height:100%;background:#1F2B2F;color:#F4F6F2;font-family:system-ui,sans-serif}
.w{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.logo{width:84px;height:84px;border-radius:22px;background:#F2B705;display:grid;place-items:center;margin:0 auto 16px;font-size:44px}
button{font:inherit;font-weight:700;background:#F2B705;color:#231C00;border:0;border-radius:12px;padding:13px 24px;margin-top:18px}
p{opacity:.8;margin:6px 0 0}</style></head>
<body><div class="w"><div><div class="logo">📶</div><h2 style="margin:0">Net nahi mil raha</h2><p>Guniyo kholne ke liye internet chalu karo.</p>
<button type="button" onclick="location.href='https://guniyo.com/?source=app'">Dobara try karo</button></div></div>
<script>/* Shown only when guniyo.com can't load. Try again automatically when the network comes back. */
window.addEventListener('online',function(){location.href='https://guniyo.com/?source=app'});</script>
</body></html>
